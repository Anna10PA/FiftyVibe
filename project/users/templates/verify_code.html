{% extends 'master.html' %}
{% load static %}

{% block title  %} 
    <title>Verify code</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'script.js' %}"></script>
{% endblock %}

{% block main %}
<main class="min-h-[90vh] px-[150px] w-full flex flex-col items-center justify-center">
    <div class='flex flex-col items-center gap-5'>
        <h3 class='text-5xl text-[#5b0E14] font-bold' id='h3'>Verify Code</h3>
        <h4 class='text-gray-900 font-semibold'>Enter the code and your account is created! Good Luck!</h4>
    </div>
    <form method='POST' class="flex flex-col items-center w-full max-w-[400px]">
        {% csrf_token %}
        <input type="text" id='code' name="code" maxlength="8" required class='w-full px-10 py-3 rounded bg-[#FaF1F4] outline-none border-[#5B0E14] border-b text-xl tracking-[25px] text-center'>
        <p id='message' class="text-red-600 font-medium my-2">{{ message }}</p>
        <button type='submit' class='bg-[#9b0E27] px-10 py-3 rounded w-full max-w-[500px] text-[#FaF1F4] duration-100 hover:opacity-90'>Submit</button>
    </form>
</main>

{% include "footer.html" %}
{% endblock main %}
