{% load static %}

{% block title %}
    <title>Fifty Vibe</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="https://kit.fontawesome.com/b2005d7310.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block 'main' %}
    <main class="min-h-[90vh] w-full flex items-start justify-between gap-[15px]">
        {% include 'nav.html' %}
        <section class="flex flex-col items-start w-full py-[20px] h-[98vh] overflow-auto">
            <div class="w-full relative">
                {% if user.cover %}
                    <img src="{{ user.cover.url }}" alt="{{ user.cover.url }}" class="w-full object-cover rounded h-[270px] "> 
                {% else %}
                    <img src="{% static 'images/default_cover.png' %}" alt="" class="w-full object-cover rounded h-[270px] ">
                {% endif %}

                {% if user.profile %}
                    <img src="{{ user.profile.url }}" alt="{{ user.profile }}" class="w-[150px] h-[150px] rounded-[50%] border border-[#FAF1F4] border-[5px] absolute -bottom-16 left-10 ">
                {% else %}
                    <img src="{% static 'images/default_profile.png' %}" alt="" class="w-[150px] h-[150px] rounded-[50%] border border-[#FAF1F4] border-[5px] absolute -bottom-16 left-10 ">
                {% endif %}
            </div> 
            <div class="relative w-full">
                <div class='absolute top-4 left-[200px]'>
                    <h2 class='font-semibold text-2xl'>{{ user.first_name }} {{ user.last_name }}</h2>
                </div>
            </div>
        </section>
        {% include 'aside.html' %}
    </main>
{% endblock %}
